<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>番茄钟 · 专注计时器</title>
<meta name="description" content="一个极简的番茄钟：专注 25 分钟，休息 5 分钟。带任务清单、今日统计与暗色模式。无需登录，数据只存在本地浏览器。">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<!-- 内联 SVG 图标，避免额外请求 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23c0392b' stroke-width='3'/%3E%3C/svg%3E">
<!-- 先于样式表做两件事，避免闪烁：
     1. 标记「JS 可用」—— 入场动效的初始态只挂在 .js 下
     2. 把已保存的主题写到 <html> 上 —— 否则暗色用户会看到一瞬白屏 -->
<script>
document.documentElement.classList.add("js");
(function () {
  try {
    var saved = localStorage.getItem("pomodoro:v2");
    var t = saved ? (JSON.parse(saved) || {}).theme : null;
    if (t === "dark" || t === "light") {
      document.documentElement.setAttribute("data-theme", t);
    }
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="assets/pomodoro.css">
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<header class="header" id="site-header">
  <div class="wrap header__inner">
    <a class="header__brand" href="#top">番茄钟</a>
    <nav class="header__nav" id="site-nav" aria-label="主导航">
      <a class="header__link" href="#top">计时器</a>
      <a class="header__link" href="#settings">设置</a>
    </nav>
    <button class="header__toggle" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="site-nav"><span></span></button>
  </div>
  <div class="header__progress" id="progress" aria-hidden="true"></div>
</header>
<main id="main">
  <section class="pomo" id="top" data-phase="focus" aria-labelledby="pomo-title">
    <div class="wrap pomo__inner">

      <p class="pomo__eyebrow reveal" style="--i:0">POMODORO</p>
      <h1 class="pomo__title reveal" id="pomo-title" style="--i:1">番茄钟</h1>
      <p class="pomo__lead reveal" style="--i:1">专注 25 分钟，休息 5 分钟。四个番茄之后，休息久一点。</p>

      <div class="pomo__dial reveal" style="--i:2">
        <svg class="pomo__ring" viewBox="0 0 116 116" aria-hidden="true" focusable="false">
        <circle class="is-track" cx="58" cy="58" r="52"></circle>
        <circle class="is-progress" cx="58" cy="58" r="52"></circle>
      </svg>
        <p class="pomo__time" role="timer" aria-live="off">25:00</p>
      </div>

      <p class="pomo__label" aria-live="polite">专注中</p>

      <ul class="pomo__steps" data-steps aria-hidden="true"><li class="pomo__step"></li><li class="pomo__step"></li><li class="pomo__step"></li><li class="pomo__step"></li></ul>

      <div class="pomo__status-line reveal" style="--i:3" aria-hidden="true"></div>

      <div class="pomo__controls reveal" style="--i:3">
        <button class="pomo__btn pomo__btn--primary" type="button" data-action="toggle">开始</button>
        <button class="pomo__btn" type="button" data-action="reset">重置</button>
        <button class="pomo__btn pomo__btn--ghost" type="button" data-action="skip">跳过</button>
      </div>

      <div class="pomo__stats reveal" style="--i:4">
        <div class="pomo__stat">
          <b data-stat="done">0</b>
          <span>今日番茄</span>
        </div>
        <div class="pomo__stat">
          <b data-stat="minutes">0</b>
          <span>专注分钟</span>
        </div>
        <div class="pomo__stat">
          <b data-stat="streak">0</b>
          <span>连续天数</span>
        </div>
      </div>

      <section class="pomo__tasks reveal" style="--i:5" aria-labelledby="pomo-tasks-title">
        <p class="pomo__tasks-head">
          <span class="pomo__tasks-title" id="pomo-tasks-title">这轮要做什么</span>
          <span class="pomo__tasks-count" data-tasks-count></span>
        </p>

        <!-- onsubmit="return false" 是第二道保险，不是主要逻辑：
             正常路径由 pomodoro.js 的 submit 监听负责。
             但如果脚本没成功运行（加载失败 / 早期报错），表单会走**原生提交**
             把页面刷掉 —— 表现为「点了没反应，输入也没了」。
             有这一行，最坏情况也只是"没加上"，不会丢输入、不会刷新。 -->
        <form class="pomo__task-add" data-task-form onsubmit="return false">
          <input class="pomo__task-input" id="pomo-task-input" data-task-input type="text"
                 aria-label="这轮要做什么"
                 placeholder="加一件事…" autocomplete="off"
                 maxlength="120">
          <button class="pomo__task-submit" type="submit">添加</button>
        </form>

        <!-- 空输入点「添加」时的反馈。
             刻意做成「始终存在的 live region，只改文字」，而不是 hidden 切换：
             display:none 的元素不在无障碍树里，取消 hidden 时读屏不一定播报，
             结果就是视力正常用户有反馈、读屏用户仍然「没反应」。
             提示文案放 data-hint-text，JS 负责搬进这个区域（内容与行为分离）。 -->
        <p class="pomo__task-hint" data-task-hint
           data-hint-text="先在上面写一件事，再点「添加」。"
           role="status" aria-live="polite"></p>

        <p class="pomo__task-empty" data-task-empty>还没有任务。写一件要专注完成的事。</p>
        <ul class="pomo__task-list" data-task-list></ul>
      </section>

      <p class="pomo__hint pomo__needs-js reveal" style="--i:6">空格开始 / 暂停，R 重置，S 跳过。任务、设置与统计只存在这台设备的浏览器里，不上传任何数据；换设备或清理浏览器数据会丢失。</p>
      <noscript><p class="pomo__hint">计时器需要 JavaScript。当前显示的是默认时长，开启脚本后即可使用。</p></noscript>

      <details class="pomo__settings reveal" id="settings" style="--i:7">
        <summary>设置</summary>
        <div class="pomo__grid">
          <div class="pomo__field">
          <label for="set-focus">专注时长</label>
          <input id="set-focus" data-set="focus" type="number" inputmode="numeric"
                 min="1" max="180" step="1" value="25"
                 aria-describedby="set-focus-unit">
          <span id="set-focus-unit" hidden>分钟</span>
        </div>
          <div class="pomo__field">
          <label for="set-short">短休息</label>
          <input id="set-short" data-set="short" type="number" inputmode="numeric"
                 min="1" max="60" step="1" value="5"
                 aria-describedby="set-short-unit">
          <span id="set-short-unit" hidden>分钟</span>
        </div>
          <div class="pomo__field">
          <label for="set-long">长休息</label>
          <input id="set-long" data-set="long" type="number" inputmode="numeric"
                 min="1" max="120" step="1" value="15"
                 aria-describedby="set-long-unit">
          <span id="set-long-unit" hidden>分钟</span>
        </div>
          <div class="pomo__field">
          <label for="set-cycle">每几个番茄长休息</label>
          <input id="set-cycle" data-set="cycle" type="number" inputmode="numeric"
                 min="1" max="12" step="1" value="4"
                 aria-describedby="set-cycle-unit">
          <span id="set-cycle-unit" hidden>个</span>
        </div>
        </div>

        <p class="pomo__hint"><div class="pomo__theme">
          <span class="pomo__theme-label">外观</span>
          <label class="pomo__radio">
            <input type="radio" name="pomo-theme" value="auto" data-theme-choice checked>
            <span>跟随系统</span>
          </label>
          <label class="pomo__radio">
            <input type="radio" name="pomo-theme" value="light" data-theme-choice>
            <span>亮色</span>
          </label>
          <label class="pomo__radio">
            <input type="radio" name="pomo-theme" value="dark" data-theme-choice>
            <span>暗色</span>
          </label>
        </div></p>

        <p class="pomo__hint">
          <label><input type="checkbox" data-set="sound"> 阶段结束播放提示音</label><br>
          <label><input type="checkbox" data-set="autoNext"> 自动进入下一阶段</label>
        </p>

        <button class="pomo__notify" type="button" data-notify hidden>开启桌面通知</button>

        <p class="pomo__hint">
          <button class="pomo__notify" type="button" data-clear-tasks>清空已完成任务</button>
        </p>
      </details>

    </div>
  </section>

  <!-- 启动自检报警条：脚本没成功运行时由下面的内联脚本显示 -->
  <p class="pomo__alert" data-boot-alert role="alert" hidden></p>
</main>
<footer class="footer">
  <div class="wrap footer__inner">
    <p>© 2026 番茄钟</p>
    <p>原生 HTML / CSS / JS 手写，零依赖。</p>
  </div>
</footer>
<script src="assets/main.js" defer></script>
<script src="assets/pomodoro.js" defer></script>
<!-- 启动自检。
     目的：脚本加载失败 / 早期抛错时，不要让用户只看到"点了没反应"，
     而是直接说明原因 —— 否则排查要来回好几轮。
     注意这段**必须内联且不 defer**：外部脚本挂了它也照样执行。 -->
<script>
(function () {
  window.setTimeout(function () {
    if (window.__POMO_BOOTED) return;
    var el = document.querySelector("[data-boot-alert]");
    if (!el) return;
    var srcs = [];
    var nodes = document.querySelectorAll("script[src]");
    for (var i = 0; i < nodes.length; i++) srcs.push(nodes[i].getAttribute("src"));
    el.textContent =
      "计时脚本没有成功运行，所以按钮暂时无效。" +
      "常见原因：① assets 目录没有和 index.html 放在同一层；" +
      "② 浏览器拦截了本地脚本（试试用 npm run dev 起本地服务器访问）；" +
      "③ 控制台有红色报错。" +
      "应有的脚本：" + (srcs.join("、") || "(无)");
    el.hidden = false;
  }, 1500);
})();
</script>
</body>
</html>
